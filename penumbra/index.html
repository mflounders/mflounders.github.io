<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: a working "case bench" (scenario left) beside a knowledge perfusion map (right); stacks on phones. */
:root{
  --bg:#F1F4F5; --surface:#FFFFFF; --surface2:#E7EDEF; --ink:#12212A; --muted:#566871; --line:#D0DADE;
  --accent:#0A6A74; --accent-soft:#D5ECEE; --on-accent:#FFFFFF;
  --core:#BF3B27; --core-soft:#F6DDD8; --penumbra:#B97C0B; --pen-soft:#F5E8C9; --perfused:#11806A; --perf-soft:#D3EEE6; --none:#9AA8AF;
  --c1:#1C7A3D; --c2a:#9A7700; --c2b:#B5560B; --c3nb:#8C4A2F; --c3h:#B42318; --ckp:#4B5D66;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1418; --surface:#132028; --surface2:#1A2A33; --ink:#E2EBEE; --muted:#93A6AE; --line:#293A43;
  --accent:#4DB4BE; --accent-soft:#163A40; --on-accent:#062328;
  --core:#EE6E56; --core-soft:#3B1E19; --penumbra:#E3AE3F; --pen-soft:#3A2E14; --perfused:#3BC09C; --perf-soft:#123329; --none:#5E6F77;
  --c1:#4CC27A; --c2a:#E0BC3A; --c2b:#F08A3C; --c3nb:#D08B6C; --c3h:#F26B5B; --ckp:#9AAEB7;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1418; --surface:#132028; --surface2:#1A2A33; --ink:#E2EBEE; --muted:#93A6AE; --line:#293A43;
  --accent:#4DB4BE; --accent-soft:#163A40; --on-accent:#062328;
  --core:#EE6E56; --core-soft:#3B1E19; --penumbra:#E3AE3F; --pen-soft:#3A2E14; --perfused:#3BC09C; --perf-soft:#123329; --none:#5E6F77;
  --c1:#4CC27A; --c2a:#E0BC3A; --c2b:#F08A3C; --c3nb:#D08B6C; --c3h:#F26B5B; --ckp:#9AAEB7;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,28px);padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,28px);padding-block:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{background:none;border:1px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
@media (max-width:640px){.brand span,.sync{display:none} .topin{padding-block:8px;gap:8px} header.top{position:static} nav.tabs button{padding:6px 11px}}

.train{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;margin-top:22px;align-items:start}
@media (max-width:920px){.train{grid-template-columns:minmax(0,1fr)}}
.case{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,30px);min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.chip.tier{background:var(--accent-soft);color:var(--accent)}
.chip.review{background:var(--pen-soft);color:var(--penumbra)}
.chip.rem{background:var(--core-soft);color:var(--core)}
h1.ctitle{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,32px);line-height:1.15;margin:4px 0 12px;text-wrap:balance;letter-spacing:-.015em}
.vig{font-size:16px;max-width:68ch;margin:0 0 16px}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0 0 20px}
.vitals div{background:var(--surface2);padding:8px 12px;min-width:0}
.vitals dt{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.vitals dd{margin:0;font-family:var(--f-mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.stepbar{display:flex;gap:6px;margin:0 0 14px}
.stepbar i{height:4px;flex:1;border-radius:2px;background:var(--surface2)}
.stepbar i.done{background:var(--accent)} .stepbar i.bad{background:var(--core)} .stepbar i.now{background:var(--muted)}
.q{font-weight:600;font-size:16.5px;margin:0 0 12px;max-width:70ch}
.opts{display:grid;gap:8px;margin:0 0 18px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:11px 14px;cursor:pointer;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:12px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .k{background:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--perfused);background:var(--perf-soft)}
.opt.right .k{background:var(--perfused);color:var(--surface)}
.opt.wrong{border-color:var(--core);background:var(--core-soft)}
.opt.wrong .k{background:var(--core);color:var(--surface)}
.opt[disabled]{cursor:default}
.opt .why{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.conf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.conf .lbl{font-size:13px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--surface);border:0;padding:6px 14px;cursor:pointer;font-size:13.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:9px 20px;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--core);color:var(--surface)}
.hint{font-size:12.5px;color:var(--muted)}
.fb{border-top:1px solid var(--line);margin-top:6px;padding-top:18px;display:grid;gap:14px}
.verdict{font-family:var(--f-display);font-weight:700;font-size:20px}
.verdict.ok{color:var(--perfused)} .verdict.no{color:var(--core)}
.explain{max-width:70ch;margin:0}
.recs{display:grid;gap:8px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:14px}
.rec .sec{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cor{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:2px 7px;border-radius:5px;white-space:nowrap;color:var(--surface);letter-spacing:.02em}
.cor.c1{background:var(--c1)} .cor.c2a{background:var(--c2a)} .cor.c2b{background:var(--c2b)} .cor.c3nb{background:var(--c3nb)} .cor.c3h{background:var(--c3h)} .cor.ckp{background:var(--ckp)}
.deltas{display:flex;gap:8px;flex-wrap:wrap}
.delta{font-family:var(--f-mono);font-size:12px;padding:4px 9px;border-radius:6px;background:var(--surface2)}
.delta .up{color:var(--perfused)} .delta .dn{color:var(--core)}
.reflect{background:var(--core-soft);border-radius:var(--r);padding:12px 14px}
.reflect p{margin:0 0 8px;font-weight:600;font-size:14px}
.reflect .rs{display:flex;flex-wrap:wrap;gap:6px}
.reflect button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.reflect button[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

aside.side{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:16px;margin:0 0 4px;font-weight:700}
.panel .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-family:var(--f-display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:13px}
.pmap{display:grid;gap:7px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 92px 34px;gap:8px;align-items:center;font-size:12.5px}
.prow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:9px;border-radius:5px;background:var(--surface2);overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.pv{font-family:var(--f-mono);font-size:11.5px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.z-core{background:var(--core)} .z-pen{background:var(--penumbra)} .z-perf{background:var(--perfused)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ladder{display:grid;gap:8px}
.rung{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;font-size:13px}
.rung .n{font-family:var(--f-mono);font-weight:500;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.rung.open .n{background:var(--accent);color:var(--on-accent)}
.rung .t{font-weight:600}
.rung .d{color:var(--muted);font-size:12px}
.mini{height:4px;background:var(--surface2);border-radius:2px;margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:left}
.stats b{display:block;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted)}

.page{margin-top:22px;display:grid;gap:20px}
.page h2.ph{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.01em}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.core{background:var(--core-soft);color:var(--core)} .pill.pen{background:var(--pen-soft);color:var(--penumbra)} .pill.perf{background:var(--perf-soft);color:var(--perfused)} .pill.none{background:var(--surface2);color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.log{display:grid;gap:10px}
.logi{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--core);border-radius:10px;padding:10px 14px;font-size:13.5px}
.logi .m{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 26px;gap:10px;align-items:center;font-size:13px;margin-bottom:7px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.gtopic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.gtopic h3{font-family:var(--f-display);font-size:18px;margin:0 0 2px}
.gtopic .s{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-bottom:10px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px}
.note{font-size:13px;color:var(--muted);max-width:80ch}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow p{margin:2px 0 0;font-size:13px;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:180px;max-width:100%}
.switch{width:44px;height:24px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);position:relative;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:22px;background:var(--on-accent)}
.mainc{display:grid;gap:14px;min-width:0;align-content:start}
.flash{background:var(--perf-soft);color:var(--perfused);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px}
.commit{display:grid;gap:10px;margin:0 0 6px}
.commit .lbl{font-weight:600;font-size:14px}
.commit textarea{width:100%;min-height:68px;resize:vertical;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit;line-height:1.45}
.commit textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.committed{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:14px;max-width:70ch}
.committed .lbl{display:block;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.committed p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.goalbar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:10px}
.goalbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:14px 0 12px}
.week span{display:grid;gap:4px;justify-items:center;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.week i{display:block;width:100%;max-width:26px;aspect-ratio:1;border-radius:6px;background:var(--surface2)}
.week i.part{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.week i.met{background:var(--accent)}
.week span.today{color:var(--ink);font-weight:500}
.switch[disabled]{opacity:.55;cursor:not-allowed}
code.f{font-family:var(--f-mono);font-size:13px;background:var(--surface2);padding:2px 6px;border-radius:5px}
.formula{font-family:var(--f-mono);font-size:13.5px;background:var(--surface2);border-radius:8px;padding:12px 14px;overflow-x:auto}
.foot{margin-top:28px;font-size:12px;color:var(--muted);max-width:90ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ===================== CONTENT ===================== */
/* Source: Prabhakaran S, et al. 2026 Guideline for the Early Management of Patients With Acute Ischemic Stroke. Stroke. 2026;57:e316–e436.
   Every recommendation below was checked against the recommendation tables and Tables 3–8 of that document. */
const TOPICS=[
 {id:"sys",name:"Systems of care & prehospital",sec:"§2.2–2.9"},
 {id:"img",name:"Imaging & diagnostics",sec:"§3.2–3.3"},
 {id:"ivt",name:"IVT decision-making",sec:"§4.6.1, 4.6.5"},
 {id:"contra",name:"IVT contraindications & complications",sec:"Tables 5, 6, 8"},
 {id:"agent",name:"Thrombolytic agent & dose",sec:"§4.6.2, 4.6.4, Table 7"},
 {id:"ext",name:"Extended-window IVT",sec:"§4.6.3, Table 3"},
 {id:"bridge",name:"IVT + EVT, techniques & adjuncts",sec:"§4.7.1, 4.7.4"},
 {id:"evta",name:"EVT: anterior LVO",sec:"§4.7.2"},
 {id:"mevo",name:"EVT: medium/distal vessels",sec:"§4.7.2"},
 {id:"evtp",name:"EVT: basilar occlusion",sec:"§4.7.3"},
 {id:"bp",name:"Blood pressure",sec:"§4.3"},
 {id:"glu",name:"Glucose",sec:"§4.5"},
 {id:"supp",name:"Oxygen, temperature & positioning",sec:"§4.1, 4.2, 4.4"},
 {id:"apt",name:"Antiplatelet therapy",sec:"§4.8"},
 {id:"ac",name:"Anticoagulation",sec:"§4.9"},
 {id:"unit",name:"Stroke unit care",sec:"§5.1–5.7"},
 {id:"cx",name:"Edema, surgery & seizures",sec:"§6.1–6.5"},
 {id:"peds",name:"Pediatric AIS",sec:"§2.3, 2.7, 3.2, 4.6.1, 4.7.5"}
];
const TOPIC=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const CORLBL={"1":"COR 1","2a":"COR 2a","2b":"COR 2b","3NB":"COR 3: No Benefit","3H":"COR 3: Harm","T8g":"Table 8: benefit likely > risk","T8r":"Table 8: relative contraindication","T8x":"Table 8: absolute contraindication","T":"Guideline table"};
const CORCLS={"1":"c1","2a":"c2a","2b":"c2b","3NB":"c3nb","3H":"c3h","T8g":"c1","T8r":"c2b","T8x":"c3h","T":"ckp"};
// [topic, COR, LOE, section, condensed wording]
const RECS={
 "sys.msu":["sys","1","A","2.5","Where available, use mobile stroke units over conventional EMS for thrombolytic-eligible patients to achieve the fastest onset-to-treatment time."],
 "sys.msuEquip":["sys","1","A","2.5","MSUs must be equipped to diagnose and treat patients with IVT."],
 "sys.msuCare":["sys","1","B-R","2.5","MSU care with streamlined protocols and neurological expertise (in person or by telemedicine) is beneficial without safety concerns."],

{id:"agent-band",tier:1,title:"Dosing by the band",topics:["agent"],

 vit:[["Weight","88 kg"],["LKW","2 h"],["NIHSS","12"]],
 q:"What dose and volume?",
 o:[["22.5 mg (4.5 mL)",""],
    ["22 mg, calculated exactly at 0.25 mg/kg","Table 7 uses weight bands; 80 to <90 kg is 22.5 mg."],
    ["25 mg (5 mL), the maximum","25 mg is the ≥90 kg band."],
    ["20 mg (4 mL)","20 mg is the 70 to <80 kg band."]],
 x:"Table 7 bands: <60 kg 15 mg; 60–<70 kg 17.5 mg; 70–<80 kg 20 mg; 80–<90 kg 22.5 mg; ≥90 kg 25 mg. If weight must be estimated, don't delay treatment to weigh.",refs:["agent.table7","agent.choice"]},
{id:"agent-alteplase",tier:1,title:"Alteplase arithmetic",topics:["agent"],
 vig:"Tenecteplase is on backorder. A 70-kg woman with a disabling left MCA syndrome is eligible for IVT at 2 h from onset.",
 vit:[["LKW","2 h"],["Weight","70 kg"],["NIHSS","11"]],
 q:"How should alteplase be given?",
 o:[["63 mg total: 6.3 mg IV bolus over 1 min, then 56.7 mg over 60 min",""],
    ["70 mg total: 7 mg bolus, then 63 mg over 60 min","That is 1 mg/kg. The stroke dose is 0.9 mg/kg."],
    ["63 mg total as a single bolus","Only 10% goes as a bolus."],
    ["90 mg total, the stroke maximum, for every adult","90 mg is the cap, reached at 100 kg."]],
 x:"0.9 mg/kg × 70 kg = 63 mg: 10% as a 1-minute bolus, the rest over 60 minutes, maximum 90 mg.",refs:["agent.choice","agent.table7"]},
{id:"ivt-nondisabling",tier:1,title:"A numb hand at 90 minutes",topics:["ivt","apt"],
 vig:"A 61-year-old accountant has numbness of the right face and hand that began 90 minutes ago. Strength, language, vision and coordination are normal. He can type and write normally. CT is unremarkable and CTA shows no occlusion.",
 vit:[["LKW","90 min"],["NIHSS","1 (sensory)"],["BP","154/88"],["Glucose","104 mg/dL"]],
 q:"What is the best acute treatment?",
 o:[["Aspirin plus clopidogrel, without thrombolysis",""],
    ["Tenecteplase, because he is inside 4.5 hours","IVT for mild non-disabling deficits is Class 3: No Benefit; it was not superior to DAPT."],
    ["CT perfusion first, then IVT if a penumbra is present","Perfusion imaging does not make a non-disabling deficit thrombolysis-eligible."],
    ["No antithrombotic for 24 hours, then aspirin","Without IVT, start DAPT within 24 h to lower early recurrence."]],
 x:"Hemisensory loss is listed in Table 4 as often not disabling. IVT is not recommended for mild non-disabling deficits; DAPT for 21 days is the Class 1 alternative for NIHSS ≤3.",refs:["ivt.nondisabling","ivt.table4","apt.minor"]},
{id:"ivt-disabling",tier:1,title:"Low score, high stakes",topics:["ivt"],
 vig:"A 54-year-old schoolteacher developed word-finding difficulty and paraphasic errors 2 hours ago. She cannot follow a multistep conversation and says she could not teach today. CT shows no hemorrhage.",
 vit:[["LKW","2 h"],["NIHSS","2 (best language 2)"],["BP","162/90"],["Glucose","118 mg/dL"]],
 q:"What next?",
 o:[["Give IVT now; the deficit is disabling despite the low NIHSS",""],
    ["DAPT, because NIHSS ≤5 is a minor stroke","NIHSS doesn't define disability; severe aphasia (≥2 on best language) is listed as clearly disabling."],
    ["CT perfusion first to confirm salvageable tissue","Within 4.5 h, advanced imaging should not delay IVT."],
    ["Observe for 30 minutes to see whether she improves","Faster treatment improves outcome."]],
 x:"Table 4 lists severe aphasia (≥2 on NIHSS best language) as typically disabling. For disabling deficits regardless of NIHSS, faster IVT improves outcome (COR 1, LOE A).",refs:["ivt.disabling","ivt.table4","ivt.fast"]},
{id:"ivt-eic",tier:1,title:"An early CT sign",topics:["ivt"],
 vig:"A 70-year-old has a disabling left MCA syndrome at 2 h. CT shows subtle loss of the left insular ribbon (ASPECTS 8) without frank hypodensity.",
 vit:[["LKW","2 h"],["NIHSS","13"],["ASPECTS","8"]],
 q:"Does the CT change the IVT decision?",
 o:[["No; mild to moderate early ischemic change does not preclude IVT, which is recommended",""],
    ["Yes; any early ischemic change is a contraindication","Only extensive clear hypodensity explaining the deficit is a contraindication."],
    ["Yes; get MRI to confirm the lesion before treating","This delays treatment without changing eligibility."],
    ["Yes; use half-dose tenecteplase","There is no reduced-dose recommendation for early ischemic change."]],
 x:"IVT is recommended despite mild-to-moderate early ischemic change (COR 1, LOE A). Extensive clear hypodensity is an absolute contraindication.",refs:["ivt.eic","contra.ichHypo"]},
{id:"ivt-antiplatelet",tier:1,title:"Already on two antiplatelets",topics:["ivt"],
 vig:"A 67-year-old with a coronary stent placed 5 months ago takes aspirin and clopidogrel. He has a disabling right hemiparesis at 1.5 h. CT is negative.",
 vit:[["LKW","1.5 h"],["NIHSS","10"],["Meds","aspirin + clopidogrel"]],
 q:"IVT?",
 o:[["Give IVT; prior antiplatelet use does not exclude it",""],
    ["Withhold IVT because of DAPT","Patients on single or dual antiplatelets should receive IVT despite a higher sICH risk (COR 1)."],
    ["Give a platelet transfusion first, then IVT","Not recommended and delays treatment."],
    ["Check platelet function testing first","Not required and delays treatment."]],
 x:"Otherwise-eligible patients taking single or dual antiplatelet therapy should receive IVT, accepting a higher sICH risk.",refs:["ivt.antiplatelet"]},
{id:"ivt-cmb",tier:1,title:"What about microbleeds?",topics:["ivt"],
 vig:"An 76-year-old with hypertension has a disabling stroke at 2 h. CT is negative. A resident asks for an MRI first to count microbleeds, since she has never had one.",
 vit:[["LKW","2 h"],["NIHSS","9"],["Prior MRI","none"]],
 q:"Your decision?",
 o:[["Give IVT without first obtaining MRI",""],
    ["Get MRI first; more than 10 microbleeds would change the decision","With unknown microbleed burden, don't delay IVT for MRI (COR 1)."],
    ["Give half-dose alteplase because of the bleeding risk","Not a recommended strategy."],
    ["Withhold IVT because elderly hypertensive patients have many microbleeds","Unknown burden is not a contraindication."]],
 x:"With unknown CMB burden, IVT should be given without first obtaining MRI. A known high burden (>10) makes usefulness uncertain (2b); 1–10 is reasonable (2a).",refs:["ivt.cmbUnknown","ivt.cmbFew","ivt.cmbMany"]},
{id:"img-creatinine",tier:1,title:"Waiting on the lab",topics:["img"],
 vig:"A 77-year-old man with chronic kidney disease arrives 3 h after sudden left hemiplegia and right gaze deviation. CT shows no hemorrhage. The technologist asks whether to hold the CTA until the creatinine results, about 40 minutes away.",
 vit:[["LKW","3 h"],["NIHSS","19"],["eGFR (last)","41"]],
 q:"Your answer?",
 o:[["Proceed with CTA now",""],
    ["Hold the CTA until creatinine results","CTA/CTP should not be delayed for creatinine (COR 1)."],
    ["Switch to MRA to avoid contrast, even though it adds 45 minutes","Vascular imaging should be done as rapidly as possible."],
    ["Skip vascular imaging and treat with IVT alone","Suspected LVO within 24 h needs vascular imaging to select EVT."]],
 x:"In suspected LVO, contrast CTA and/or CTP should not wait for a creatinine, and brain plus vascular imaging should be done as rapidly as possible.",refs:["img.creat","img.lvo"]},
{id:"img-ecg",tier:1,title:"Troponin pending",topics:["img","ivt"],
 vig:"An eligible patient with a disabling deficit is 2 h from onset; tenecteplase is drawn up. He went straight from the ambulance to CT, so no ECG has been done and the troponin is pending. He takes no anticoagulants and has no known bleeding disorder.",
 vit:[["LKW","2 h"],["NIHSS","12"],["Glucose","141 mg/dL"]],
 q:"What do you do?",
 o:[["Give tenecteplase now; obtain the ECG and troponin without delaying treatment",""],
    ["Wait for the troponin to exclude MI first","Troponin is recommended but should not delay IVT."],
    ["Get the ECG first and treat only if there is no ST elevation","The ECG is recommended but should not delay IVT."],
    ["Hold IVT until the platelet count and INR are back","With no reason to suspect an abnormal result, don't delay IVT for these tests (2a)."]],
 x:"ECG (COR 1, C-LD) and troponin (COR 1, B-NR) are recommended but should not delay IVT. Glucose is the test that must precede IVT.",refs:["img.ecg","img.trop","ivt.noLabs","ivt.glucose"]},
{id:"glu-target",tier:1,title:"Insulin drip target",topics:["glu"],
 vig:"Day 1 after a right MCA stroke in a man with type 2 diabetes. Glucose readings run 250–280 mg/dL. The ICU's general insulin protocol targets 80–130 mg/dL.",
 vit:[["Glucose","250–280"],["HbA1c","9.1%"]],
 q:"What glucose target should you order?",
 o:[["140–180 mg/dL",""],
    ["80–130 mg/dL, per the ICU protocol","IV insulin to 80–130 is Class 3: No Benefit (LOE A) and increases severe hypoglycemia."],
    ["Below 250 mg/dL with sliding-scale insulin only","Persistent hyperglycemia should be treated to 140–180."],
    ["No treatment unless above 300 mg/dL","Persistent hyperglycemia is linked to worse outcomes."]],
 x:"Treat persistent hyperglycemia to 140–180 mg/dL with close monitoring (2a); avoid intensive 80–130 targets.",refs:["glu.target","glu.intensive"]},
{id:"glu-hypo",tier:1,title:"A mimic on the glucometer",topics:["glu"],
 vig:"EMS brings a 70-year-old on insulin with acute expressive aphasia and right arm weakness.",
 vit:[["Fingerstick","46 mg/dL"],["BP","158/84"],["LKW","40 min"]],
 q:"First step?",
 o:[["Treat the hypoglycemia, then re-examine",""],
    ["Give IVT immediately if CT is negative","Treat glucose <60 mg/dL first; it can mimic stroke."],
    ["Correct glucose only after CT and CTA","Correction takes minutes and may resolve the deficit."],
    ["Treat only if a repeat check is below 40 mg/dL","The treatment threshold is <60 mg/dL."]],
 x:"Treat hypoglycemia <60 mg/dL (COR 1). If a disabling deficit persists after correction, IVT is recommended (COR 1, C-LD).",refs:["glu.hypo","ivt.glucoseMimic"]},
{id:"bp-preivt",tier:1,title:"Just above the line",topics:["bp"],
 vig:"A patient with a disabling left hemiparesis is 2 h from onset; CT is negative. BP is 196/112 on two readings. She is otherwise IVT-eligible.",
 vit:[["BP","196/112"],["LKW","2 h"],["NIHSS","10"]],
 q:"Next step?",
 o:[["Lower BP to <185/110 with IV labetalol or nicardipine, give IVT, then keep it <180/105 for 24 h",""],
    ["Give IVT now; the elevation is modest","BP must be <185/110 before IVT starts."],
    ["Lower SBP to <140 before IVT to reduce bleeding","Not recommended, and it delays treatment."],
    ["Withhold IVT; BP above 185/110 excludes treatment","BP that can be lowered below 185/110 does not exclude IVT."]],
 x:"Lower BP to <185/110 before IVT (COR 1, B-NR) and maintain <180/105 for at least 24 h after (COR 1, B-R).",refs:["bp.preIvt","bp.postIvt"]},
{id:"bp-ivt140",tier:1,title:"After thrombolysis",topics:["bp"],
 vig:"Three hours after alteplase for a moderate left MCA stroke, BP is 166/94. A resident proposes a nicardipine infusion to SBP <140 to reduce hemorrhage risk.",
 vit:[["BP","166/94"],["NIHSS","8 → 5"],["Post-IVT","3 h"]],
 q:"Your response?",
 o:[["Keep BP <180/105; an SBP <140 target is not recommended",""],
    ["Agree: target SBP <140 for 24 h","Intensive lowering after IVT is Class 3: No Benefit."],
    ["Target SBP 100–120 to minimize symptomatic ICH","This risks hypoperfusion and has no supporting evidence."],
    ["Stop BP monitoring once below 180/105","Table 7 requires checks every 15 min for 2 h, every 30 min for 6 h, then hourly to 24 h."]],
 x:"Maintain <180/105 for at least 24 h after IVT; intensive SBP <140 (vs <180) does not improve function.",refs:["bp.ivt140","bp.postIvt","agent.monitor"]},
{id:"bp-evt140",tier:1,title:"Complete reperfusion",topics:["bp"],
 vig:"After thrombectomy for a left M1 occlusion with mTICI 3 reperfusion, SBP is 158. The post-procedure order set reads 'SBP <140 × 72 h.' There is no other indication to lower BP.",
 vit:[["Reperfusion","mTICI 3"],["SBP","158"],["NIHSS","16 → 6"]],
 q:"What do you do with that order?",
 o:[["Change it: keep ≤180/105 for 24 h; an SBP <140 target is harmful here",""],
    ["Keep it; full reperfusion makes tight control safe","SBP <140 for 72 h after successful anterior EVT is Class 3: Harm (LOE A)."],
    ["Tighten it to SBP <120 for 24 h","More intensive still; same harm signal."],
    ["Discontinue BP monitoring since the vessel is open","≤180/105 during and for 24 h after EVT is reasonable."]],
 x:"After successful anterior circulation EVT (mTICI 2b–3), intensive SBP <140 for 72 h is harmful; ≤180/105 for 24 h is reasonable (2a).",refs:["bp.evt140","bp.periEvt"]},
{id:"bp-noreperf",tier:1,title:"Permissive hypertension",topics:["bp"],
 vig:"A 69-year-old presents 30 h after onset of left leg weakness. He receives no IVT or EVT. He has no chest pain, heart failure, aortic dissection or other indication to lower BP.",
 vit:[["BP","194/102"],["LKW","30 h"],["NIHSS","4"]],
 q:"What is the BP plan?",
 o:[["Do not start antihypertensives yet",""],
    ["Start oral amlodipine to bring BP under 140/90 today","Starting treatment below 220/120 in the first 48–72 h does not prevent death or dependency (3: No Benefit, LOE A)."],
    ["IV labetalol to <185/110 in case he becomes an IVT candidate","He is not a reperfusion candidate."],
    ["Lower by 50% over the first hour","Rapid large reductions risk hypoperfusion."]],
 x:"Without IVT/EVT or a comorbid indication, treating BP <220/120 in the first 48–72 h does not help; at ≥220/120 the benefit is uncertain (2b).",refs:["bp.noReperf","bp.over220","bp.comorbid"]},
{id:"evtp-basilar",tier:1,title:"Fourteen hours, basilar",topics:["evtp"],
 vig:"A 58-year-old is found with quadriparesis, dysarthria and ophthalmoplegia. CTA shows a basilar artery occlusion.",
 vit:[["LKW","14 h"],["NIHSS","22"],["Prestroke mRS","0"],["PC-ASPECTS","8"]],
 q:"Is EVT indicated?",
 o:[["Yes, EVT is recommended",""],
    ["No; posterior circulation EVT is not supported beyond 6 h","Basilar EVT is Class 1 within 24 h of onset."],
    ["No; basilar thrombectomy is still investigational","Several RCTs showed benefit; the recommendation is Class 1, LOE A."],
    ["Only if NIHSS is below 10","NIHSS ≥10 is the inclusion criterion."]],
 x:"Basilar occlusion with mRS 0–1, NIHSS ≥10 and PC-ASPECTS ≥6: EVT within 24 h is Class 1 (LOE A).",refs:["evtp.basilar","evtp.mild"]},
{id:"evta-core",tier:1,title:"ASPECTS 4 at five hours",topics:["evta"],
 vig:"A 72-year-old woman has a left ICA-terminus occlusion with global aphasia and right hemiplegia.",
 vit:[["LKW","5 h"],["NIHSS","20"],["Prestroke mRS","0"],["ASPECTS","4"]],
 q:"EVT?",
 o:[["Recommended (Class 1)",""],
    ["Not indicated because ASPECTS is below 6","Within 6 h, ASPECTS 3–10 is Class 1."],
    ["Only if CT perfusion core is under 70 mL","Perfusion core is not required within 6 h for ICA/M1 with ASPECTS 3–10."],
    ["Not indicated; a large core means comfort care only","Large-core trials showed EVT benefit; discuss expectations with the family."]],
 x:"0–6 h, ICA/M1, NIHSS ≥6, mRS 0–1, ASPECTS 3–10: Class 1, LOE A. The guideline advises discussing the smaller absolute benefit of large-core EVT with patients and families.",refs:["evta.early","evta.core02"]},
{id:"mevo-distal",tier:1,title:"A distal branch",topics:["mevo"],
 vig:"A 74-year-old woman has right arm weakness and dysarthria. She received tenecteplase at 1.5 h. CTA shows an occluded left M3 branch.",
 vit:[["LKW","3 h"],["NIHSS","6"],["ASPECTS","9"]],
 q:"Should she have EVT?",
 o:[["No; EVT for distal MCA occlusions is not recommended",""],
    ["Yes; any occlusion visible on CTA within 6 h qualifies","ESCAPE-MeVO and DISTAL showed no benefit (3: No Benefit, LOE A)."],
    ["Yes, because NIHSS is at least 6","NIHSS ≥6 criteria apply to ICA/M1 and dominant proximal M2."],
    ["Yes, if she hasn't improved 30 minutes after tenecteplase","Distal occlusions are not EVT targets."]],
 x:"EVT is Class 3: No Benefit for nondominant or codominant M2, distal MCA, ACA and PCA occlusions.",refs:["mevo.distal","mevo.m2"]},
{id:"sys-msu",tier:1,title:"The CT on wheels",topics:["sys"],
 vig:"A city council asks you, as stroke director, what the 2026 guideline says about funding mobile stroke units.",
 q:"Which statement is accurate?",
 o:[["Where available, MSUs are recommended over conventional EMS for thrombolytic-eligible patients and must be able to diagnose and give IVT",""],
    ["MSUs are recommended mainly because trials showed better thrombectomy outcomes","B_PROUD and BEST-MSU showed benefit through faster IVT, not better EVT outcomes."],
    ["MSUs are optional because evidence is only observational","Class 1, LOE A from randomized trials."],
    ["MSUs should transport without treating so the CSC can decide","The point of an MSU is treatment on scene."]],
 x:"MSUs: Class 1, LOE A for thrombolytic-eligible patients; must be equipped to diagnose and give IVT. For EVT candidates, triage with prenotification is 2a.",refs:["sys.msu","sys.msuEquip","sys.msuEvt"]},
{id:"sys-field",tier:1,title:"Field orders",topics:["sys"],
 vig:"Paramedics on scene with a 75-year-old with acute left hemiparesis call medical control for orders.",
 vit:[["BP","214/116"],["Glucose","138 mg/dL"],["LKW","35 min"]],
 q:"Best order?",
 o:[["Validated stroke screen, prenotify the stroke center, transport; no field BP lowering",""],
    ["Apply transdermal nitroglycerin for the BP","Class 3: Harm (LOE A), especially in ICH."],
    ["IV antihypertensive en route to SBP 130–140","Class 3: No Benefit."],
    ["Remote ischemic conditioning with the BP cuff during transport","Class 3: No Benefit."]],
 x:"In the field: a brief stroke assessment tool (COR 1, A) and prenotification (COR 1). Prehospital GTN is harmful; field BP targets and RIC show no benefit.",refs:["sys.ems","sys.prenotify","sys.gtn","sys.fieldBp","sys.ric"]},
{id:"apt-after-ivt",tier:1,title:"Aspirin after alteplase",topics:["apt"],
 vig:"An 80-year-old received alteplase 4 hours ago for a disabling stroke; no EVT was done. He has no coronary stent or other strong antiplatelet indication. The team asks when to start aspirin.",
 vit:[["Post-IVT","4 h"],["NIHSS","9 → 6"]],
 q:"When should aspirin start?",
 o:[["After the 24-h follow-up CT or MRI, within 48 h of onset",""],
    ["Now, to prevent reocclusion","Antiplatelets in the first 24 h after IVT have uncertain risk (2b); reserved for strong concomitant indications."],
    ["IV aspirin now","IV aspirin during or within 90 min of starting IVT is Class 3: Harm."],
    ["After 7 days","Aspirin is recommended within 48 h of onset (COR 1, LOE A)."]],
 x:"Table 7: obtain follow-up imaging at 24 h before antiplatelets. Aspirin within 48 h of onset is Class 1.",refs:["apt.aspirin","apt.postIvt","agent.monitor","apt.ivAspirin"]},
{id:"ac-af",tier:1,title:"When to start the DOAC",topics:["ac"],
 vig:"A 73-year-old with newly found atrial fibrillation has a small right frontal infarct. MRI shows no hemorrhagic transformation. Swallow screen passed.",
 vit:[["NIHSS","3"],["Infarct","small"],["Day","2"]],
 q:"Timing of oral anticoagulation?",
 o:[["An early DOAC start is reasonable",""],
    ["Wait at least 14 days","For milder strokes, early anticoagulation is low risk and reasonable vs delayed (2a, LOE A)."],
    ["Start IV heparin now to prevent early recurrence","Early anticoagulation within 48 h to prevent worsening is 3: No Benefit."],
    ["Aspirin plus the DOAC together","Routinely adding antiplatelet to OAC in AF without CAD/stent is 3: Harm."]],
 x:"Early oral anticoagulation is reasonable in carefully selected, milder AF-related strokes, though its efficacy against early recurrence is not established.",refs:["ac.early","ac.urgent","apt.afAdd"]},
{id:"unit-dysphagia",tier:1,title:"A pill before the swallow screen",topics:["unit"],
 vig:"Day 1, NIHSS 9 with dysarthria. Pharmacy has verified oral aspirin, to be taken with water, but the nurse has not done the swallow screen yet.",
 vit:[["NIHSS","9"],["Dysarthria","moderate"]],
 q:"What should happen?",
 o:[["Bedside swallow screen before the pill and water",""],
    ["Give the aspirin with a sip of water; screening is for meals","A bedside screen comes before any liquid or food intake."],
    ["Crush it into applesauce without screening","Still oral intake before screening."],
    ["Skip aspirin until a videofluoroscopic study is done","Screen first; instrumental testing is for failed or impossible screens (2a)."]],
 x:"Bedside swallow screening before liquid or food intake is Class 1 (C-EO). If failed, an instrumental assessment is reasonable.",refs:["unit.dysScreen","unit.instrumental"]},
{id:"unit-dvt",tier:1,title:"Immobile on day 2",topics:["unit"],
 vig:"A 68-year-old with dense left hemiplegia cannot get out of bed on day 2. No contraindication to mechanical prophylaxis.",
 vit:[["Mobility","bedbound"],["Day","2"]],
 q:"Best DVT prophylaxis to start now?",
 o:[["Intermittent pneumatic compression",""],
    ["Elastic compression stockings","Class 3: Harm (skin breakdown, ulceration, necrosis)."],
    ["Therapeutic-dose heparin infusion","Full anticoagulation is not prophylaxis."],
    ["None until he can mobilize","Immobile patients need prophylaxis now."]],
 x:"IPC is Class 1 (B-R); prophylactic-dose SC heparin is also reasonable (2a). Elastic stockings cause harm.",refs:["unit.ipc","unit.sqHeparin","unit.stockings"]},
{id:"unit-foley",tier:1,title:"Admission order set",topics:["unit"],
 vig:"The stroke admission order set includes an indwelling urinary catheter for every patient 'for accurate I/O', plus mobilization out of bed within 12 hours for all.",
 q:"Which change does the guideline support?",
 o:[["Remove both: routine Foley placement and very early high-dose mobilization are harmful",""],
    ["Keep both; they reduce complications","Routine catheters raise UTI risk (3: Harm), and very early high-dose mobilization within 24 h may harm (3: Harm)."],
    ["Keep the Foley, drop the mobilization","Routine indwelling catheters are Class 3: Harm."],
    ["Keep the mobilization, drop the Foley","Very early high-dose mobilization within 24 h is Class 3: Harm."]],
 x:"Avoid routine indwelling bladder catheters (3: Harm, C-LD) and high-dose very early mobilization within 24 h (3: Harm, B-R).",refs:["unit.foley","unit.earlyMob"]},
{id:"cx-glib",tier:1,title:"Swelling ahead",topics:["cx"],
 vig:"A 55-year-old has a complete left MCA territory infarct at 10 h and is still awake. The team expects malignant edema. A colleague suggests IV glibenclamide.",
 vit:[["Age","55"],["NIHSS","21"],["Hours","10"]],
 q:"Best plan?",
 o:[["No glibenclamide; monitor closely, discuss goals with family and involve neurosurgery early",""],
    ["Start IV glibenclamide to prevent edema","Class 3: No Benefit in large hemispheric infarction (age 18–70)."],
    ["High-dose dexamethasone","Corticosteroids for ischemic swelling are Class 3: Harm."],
    ["Induce hypothermia to 33 °C","Hypothermia for brain swelling is Class 3: Harm."]],
 x:"Early goals-of-care discussion and close monitoring are Class 1; if he deteriorates within 48 h despite medical therapy, craniectomy is Class 1 at age ≤60.",refs:["cx.glib","cx.steroids","cx.discuss","cx.dc60"]},
{id:"cx-seizure",tier:1,title:"Cortical infarct, no seizures",topics:["cx"],
 vig:"A 64-year-old has a large right frontoparietal cortical infarct. She has had no seizures. The admitting resident asks about levetiracetam.",
 q:"Should she get antiseizure medication?",
 o:[["No prophylactic antiseizure medication",""],
    ["Levetiracetam for 7 days given cortical involvement","Prophylaxis is Class 3: No Benefit."],
    ["Phenytoin load, then 30 days","Prophylaxis is Class 3: No Benefit."]],
 x:"Prophylactic antiseizure medication is not recommended; after an unprovoked seizure, antiseizure medication is recommended.",refs:["cx.szProph","cx.szTreat"]},
{id:"peds-imaging",tier:1,title:"A child with a sudden deficit",topics:["peds"],
 vig:"A 10-year-old girl has sudden left arm and face weakness that started 70 minutes ago and persists. Your MRI can scan her in 15 minutes.",
 vit:[["Age","10 y"],["Onset","70 min"],["MRI","available in 15 min"]],
 q:"Imaging?",
 o:[["Emergent MRI with MRA of the head and neck",""],
    ["CT/CTA, as in the adult pathway","CT/CTA is the fallback when MRI isn't available within 25 minutes."],
    ["Observe; this is likely a mimic","Suspect stroke in children with sudden, ongoing focal deficits (COR 1)."],
    ["Non-contrast CT only","Vascular imaging is needed to find an LVO."]],
 x:"Emergent MRI/MRA is reasonable (2a); use CT/CTA if MRI isn't available within 25 minutes.",refs:["peds.mri","peds.ct","peds.suspect"]},
{id:"supp-fever",tier:1,title:"38.6 °C on day 1",topics:["supp"],
 vig:"Day 1 after a left MCA stroke, the patient's temperature is 38.6 °C.",
 vit:[["Temp","38.6 °C"],["Day","1"]],
 q:"Best approach?",
 o:[["Find the source (for example aspiration or UTI) and treat toward normothermia",""],
    ["Induce hypothermia to 33 °C for neuroprotection","Class 3: No Benefit."],
    ["No action; fever is expected after stroke","Targeting normothermia is Class 1 (B-R)."]],
 x:"Target normothermia (COR 1, B-R) and identify and treat the source (COR 1, C-EO).",refs:["supp.fever","supp.feverSource","supp.hypothermia"]},
{id:"supp-oxygen",tier:1,title:"Routine oxygen?",topics:["supp"],
 vig:"A 71-year-old with a lacunar stroke, not an EVT candidate, has SpO₂ 97% on room air. The nurse places 2 L nasal cannula per an old protocol.",
 vit:[["SpO₂","97% RA"],["NIHSS","4"],["EVT","not a candidate"]],
 q:"What does the guideline say?",
 o:[["Supplemental oxygen is not recommended without hypoxia; give it only to keep SpO₂ >94%",""],
    ["Oxygen for all stroke patients for the first 24 h","Without hypoxia and EVT eligibility, oxygen is 3: No Benefit."],
    ["Target SpO₂ 100% to protect the penumbra","No evidence supports this."],
    ["Hyperbaric oxygen improves recovery","HBO is 3: No Benefit except for arterial air embolism."]],
 x:"Give oxygen for hypoxia to keep SpO₂ >94% (COR 1). Routine oxygen without hypoxia in EVT-ineligible patients is Class 3: No Benefit.",refs:["supp.spo2","supp.noO2"]},
{id:"ext-wakeup",tier:1,title:"Woke up aphasic",topics:["ext"],

{id:"ivt-sickle",tier:1,title:"Sickle cell disease",topics:["ivt"],

 x:"In eligible adults with known sickle cell disease, IVT can be beneficial (2a, B-NR).",refs:["ivt.sickle"]},

/* ---------- TIER 2 ---------- */
{id:"evta-mrs2",tier:2,title:"Walks with a cane",topics:["evta"],

{id:"evta-mrs34",tier:2,title:"Moderate prestroke disability",topics:["evta"],

{id:"evta-late-old",tier:2,title:"Same scan, older patient",topics:["evta"],

{id:"mevo-m2",tier:2,title:"Proximal M2",topics:["mevo"],

{id:"evtp-mild",tier:2,title:"Basilar, mild deficits",topics:["evtp"],

    ["EVT is recommended (Class 1)","Class 1 requires NIHSS ≥10."],
    ["EVT is contraindicated below NIHSS 10","Not contraindicated; evidence is uncertain."],
    ["EVT is reasonable (2a)","The guideline gives 2b."]],

{id:"ext-lvo-noevt",tier:2,title:"No way to the angio suite",topics:["ext"],

{id:"ext-dwiflair",tier:2,title:"Unknown onset, MRI",topics:["ext","img"],
 vig:"A 66-year-old is found at 10:00 with right hemiparesis; he was last seen normal at 21:00 the previous evening. It is now 11:10. MRI shows a small acute left corona radiata DWI lesion (well under one-third of the MCA territory) with no marked FLAIR change. No LVO.",

    ["Not eligible; last known well was 14 h ago","Imaging selection replaces clock time for unknown onset."],
    ["CT perfusion is required; MRI cannot select patients","DWI–FLAIR selection is a separate 2a pathway."],
    ["Proceed to EVT","There is no LVO."]],

{id:"apt-inspires",tier:2,title:"Day 2, intracranial stenosis",topics:["apt"],

    ["DAPT for 90 days","21 days, then SAPT."],

{id:"apt-cyp",tier:2,title:"A loss-of-function carrier",topics:["apt"],

{id:"sys-destination",tier:2,title:"Bypass or not",topics:["sys"],

    ["Bypass to the TSC; suspected LVO always goes direct","In well-coordinated systems, bypass to a distant TSC is 3: No Benefit (RACECAT)."],
    ["The closest non-stroke ED for stabilization","Transport to the closest appropriate stroke facility (COR 1)."],
    ["Wait on scene for a helicopter","Delay costs treatment time."]],
 x:"Direct-to-TSC is 2a where a TSC is locally accessible and 2b in poorly coordinated systems, but 3: No Benefit when bypassing proficient local centers for a distant TSC.",refs:["sys.bypass","sys.directTsc","sys.poorSys","sys.closest"]},
{id:"sys-dido",tier:2,title:"Drip and ship",topics:["sys","bridge"],
 vig:"At a primary stroke center, a patient received tenecteplase 35 minutes after arrival. CTA shows a right M1 occlusion. The transfer coordinator asks what to prioritize.",

{id:"contra-doac",tier:2,title:"Apixaban this morning",topics:["contra"],

{id:"contra-spine",tier:2,title:"Surgery last week",topics:["contra"],

{id:"contra-coag",tier:2,title:"The INR comes back",topics:["contra"],

{id:"contra-aneurysm",tier:2,title:"An incidental aneurysm",topics:["contra"],

{id:"contra-sich",tier:2,title:"Headache after tenecteplase",topics:["contra"],

{id:"ivt-crao",tier:2,title:"Sudden monocular blindness",topics:["ivt"],

{id:"peds-evt",tier:2,title:"Nine years old, M1",topics:["peds"],

{id:"cx-dc-older",tier:2,title:"Malignant edema at 66",topics:["cx"],

{id:"unit-pes",tier:2,title:"Still can't swallow",topics:["unit"],

const TIERS={1:{name:"Foundations",d:"One guideline, direct application"},2:{name:"Applied",d:"One guideline, with the nuance that trips people up"},3:{name:"Interacting",d:"Two guidelines in the same patient"},4:{name:"Full pathway",d:"Multi-step cases across the whole guideline"}};

/* ===================== STATE ===================== */
const LSKEY="penumbra-v1";
const SESSION_GAP=30*60e3; // a sitting ends after 30 minutes without an answer
function freshState(){return {v:2,updatedAt:0,topics:{},items:{},history:[],tiers:{1:{n:0,recent:[]},2:{n:0,recent:[]},3:{n:0,recent:[]},4:{n:0,recent:[]}},reasons:{},settings:{lambda:1.5,confPenalty:true,unlockAll:false,goal:3,commitFirst:false},totals:{steps:0,correct:0},days:{},sessions:0,lastActive:0};}
function dayKey(t){const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function normalize(raw){
  const s=Object.assign(freshState(),raw||{});
  s.settings=Object.assign(freshState().settings,(raw&&raw.settings)||{});
  const hist=s.history||[];
  if(!raw||!raw.days){ // backfill: completed cases per day, judged against the 1-case pace used before goals existed
    s.days={};
    hist.forEach(h=>{const it=BYID[h.id]; if(it&&h.step===it.steps.length-1){const k=dayKey(h.t); const d=s.days[k]||(s.days[k]={n:0,goal:1}); d.n++;}});
  }
  if(!raw||raw.sessions==null){ // backfill: count sittings from answer timestamps and when each area was last practiced
    let n=0,last=0;
    hist.forEach(h=>{ if(h.t-last>SESSION_GAP) n++; last=h.t; const it=BYID[h.id]; const st=it&&it.steps[h.step]; if(st) st.topics.forEach(t=>{ if(s.topics[t]) s.topics[t].ls=n; }); });

let S=freshState();

const session={answered:0,correct:0,streak:0,relearn:[],remediation:{},remTier:4,lastId:null,recent:[],forced:null,practice:false};
let remote=null; // {ref}
let saveTimer=null, writing=Promise.resolve();
function save(){

function setSync(t){const el=document.getElementById("sync"); if(el) el.textContent=t;}

/* ===================== ENGINE ===================== */
const CREDIT={guess:0.5,fair:0.85,cert:1};
function tstate(t){return S.topics[t]||(S.topics[t]={c:0,wg:0,wf:0,wc:0,n:0,k:0,last:0});}
function mastery(t){const s=S.topics[t]; if(!s||!s.n) return null; const L=S.settings.lambda, k=S.settings.confPenalty?1.5:1;
  const w=0.7*s.wg+s.wf+k*s.wc; return s.c/(s.c+L*w+1);}
function zone(m){return m==null?"none":m<0.4?"core":m<0.7?"pen":"perf";}
const ZLBL={none:"Not yet imaged",core:"Core gap",pen:"Penumbra",perf:"Perfused"};
/* Session-based fading (internal only): after FADE_FREE sittings without practice in an area,
   its working mastery for case selection drops by (1-FADE) per sitting. Displayed bars are unchanged. */
const FADE_FREE=2, FADE=0.94;
function touchSession(){const now=Date.now(); if(!S.lastActive||now-S.lastActive>SESSION_GAP) S.sessions=(S.sessions||0)+1; S.lastActive=now;}
function staleSessions(t){const s=S.topics[t]; if(!s||s.ls==null) return 0; return Math.max(0,(S.sessions||0)-s.ls);}
function effMastery(t){const m=mastery(t); if(m==null) return null; return m*Math.pow(FADE,Math.max(0,staleSessions(t)-FADE_FREE));}
/* Daily goal and streak */
function todayKey(){return dayKey(Date.now());}
function met(d){return !!d && d.n>=(d.goal||1);}
function dayStreak(){const d=new Date(); if(!met(S.days[dayKey(d)])) d.setDate(d.getDate()-1); let n=0; while(met(S.days[dayKey(d)])){n++; d.setDate(d.getDate()-1);} return n;}
function bestStreak(){let best=0,run=0,prev=null; Object.keys(S.days).filter(k=>met(S.days[k])).sort().forEach(k=>{ if(prev){const p=new Date(prev+"T12:00:00"); p.setDate(p.getDate()+1); run=dayKey(p)===k?run+1:1;} else run=1; best=Math.max(best,run); prev=k;}); return best;}
function last7(){const out=[], d=new Date(); d.setDate(d.getDate()-6); for(let i=0;i<7;i++){const k=dayKey(d); out.push({k,lbl:d.toLocaleDateString([], {weekday:"narrow"}),rec:S.days[k],today:i===6}); d.setDate(d.getDate()+1);} return out;}
/* Commit-first: optional, then permanent once every case has been seen */
function seenCount(){return ITEMS.filter(i=>S.items[i.id]&&S.items[i.id].seen>0).length;}
function allSeen(){return seenCount()===ITEMS.length;}
function commitMode(){return !!S.settings.commitFirst||allSeen();}
function recordStep(it,st,ok,conf){
  st.topics.forEach(t=>{const s=tstate(t); s.c*=0.9; s.wg*=0.9; s.wf*=0.9; s.wc*=0.9; s.n++; s.last=Date.now(); s.ls=S.sessions;
    if(ok){s.c+=CREDIT[conf]; s.k++;} else { if(conf==="guess")s.wg+=1; else if(conf==="fair")s.wf+=1; else s.wc+=1; } });
  const tr=S.tiers[it.tier]; tr.n++; tr.recent.push(ok?1:0); if(tr.recent.length>8) tr.recent.shift();
  S.totals.steps++; if(ok)S.totals.correct++;
}
function recordItem(it,allOk,conf){
  const now=Date.now(); const r=S.items[it.id]||(S.items[it.id]={box:0,due:0,seen:0,lapses:0});
  r.seen++; r.last=now;
  if(!allOk){r.box=0; r.lapses++; r.due=now+INTERVALS[0];}
  else if(conf==="guess"){r.due=now+(r.box===0?INTERVALS[0]:INTERVALS[r.box]/2);}
  else {r.box=Math.min(5,r.box+1); r.due=now+INTERVALS[r.box];}
}
function tierAcc(t){const r=S.tiers[t].recent; return r.length?r.reduce((a,b)=>a+b,0)/r.length:0;}
function unlockedTier(){ if(S.settings.unlockAll) return 4; let t=S.maxTier||1; while(t<4 && S.tiers[t].n>=UNLOCK[t] && tierAcc(t)>=UNLOCK_ACC) t++; if(t>(S.maxTier||1)) S.maxTier=t; return t; }
function pickNext(){
  const now=Date.now(), maxT=unlockedTier();
  if(session.forced){const it=BYID[session.forced]; session.forced=null; if(it) return serve(it,"retry");}
  // interleaving: topics of the last two cases served
  const lastT=new Set((BYID[session.recent[0]]||{topics:[]}).topics), prevT=new Set((BYID[session.recent[1]]||{topics:[]}).topics);
  const ready=session.relearn.find(r=>r.wait<=0 && r.id!==session.lastId && !BYID[r.id].topics.some(t=>lastT.has(t)));
  if(ready){ session.relearn=session.relearn.filter(r=>r!==ready); return serve(BYID[ready.id],"relearn"); }
  let best=null,bs=-1e9,bestTag="";
  for(const it of ITEMS){
    if(it.tier>maxT || it.id===session.lastId || session.relearn.some(r=>r.id===it.id)) continue;
    const r=S.items[it.id]; let s=0, tag="new";
    if(it.topics.some(t=>lastT.has(t))) s-=30; if(it.topics.some(t=>prevT.has(t))) s-=15;
    if(r&&r.seen){ if(r.due>now && !session.practice) continue; tag="review"; s+= r.due<=now ? 30+Math.min(20,(now-r.due)/36e5) : 0; if(session.practice) s+=8*r.lapses; }
    else s+=22;
    const gaps=it.topics.map(t=>{const m=effMastery(t); return m==null?0.55:1-m;}); s+=40*gaps.reduce((a,b)=>a+b,0)/gaps.length;
    if(it.topics.some(t=>session.remediation[t]>0)){ s+=35; if(it.tier<=session.remTier) s+=10; tag="remediation"; }
    if(it.tier===maxT) s+=14; else if(it.tier===maxT-1) s+=6;

}
function serve(it,tag){
  session.relearn.forEach(r=>r.wait--);

function nextDue(){let m=Infinity; const maxT=unlockedTier(); for(const it of ITEMS){ if(it.tier>maxT) continue; const r=S.items[it.id]; if(!r||!r.seen) return 0; m=Math.min(m,r.due);} return m;}

  touchSession();
  recordStep(it,st,ok,cur.conf);
  cur.results[cur.step]=ok; cur.submitted=true; cur.confs=(cur.confs||[]); cur.confs[cur.step]=cur.conf;
  session.answered++; if(ok){session.correct++;session.streak++;} else {session.streak=0; st.topics.forEach(t=>session.remediation[t]=2); session.remTier=it.tier;}
  const h={t:Date.now(),id:it.id,step:cur.step,ok,conf:cur.conf,choice:cur.choice,reason:null}; if(cur.revealed&&cur.commit.trim()) h.commit=cur.commit.trim().slice(0,240);
  S.history.push(h);
  if(S.history.length>400) S.history.splice(0,S.history.length-400);
  save(); render();
}
function next(){
  const it=cur.item, st=it.steps[cur.step];
  if(!cur.results[cur.step]){ if(cur.reflect==null) return; S.reasons[cur.reflect]=(S.reasons[cur.reflect]||0)+1; const h=S.history[S.history.length-1]; if(h) h.reason=cur.reflect; }
  if(cur.step<it.steps.length-1){ cur.step++; cur.choice=null; cur.conf=null; cur.submitted=false; cur.reflect=null; cur.commit=""; cur.revealed=false; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const allOk=cur.results.every(Boolean); const worst=cur.confs.includes("guess")?"guess":cur.confs.includes("fair")?"fair":"cert";
  recordItem(it,allOk,worst);
  const k=todayKey(), d=S.days[k]||(S.days[k]={n:0,goal:S.settings.goal}); const was=met(d); d.goal=S.settings.goal; d.n++;
  if(!was&&met(d)){ const s=dayStreak(); session.flash=`Daily goal met · ${s} day${s>1?"s":""} in a row`; }
  if(allSeen()&&!S.commitForcedNoted){ S.commitForcedNoted=true; session.flash=(session.flash?session.flash+" · ":"")+"You've seen every case, so commit-first is now always on"; }
  if(!allOk && !session.relearn.some(r=>r.id===it.id)) session.relearn.push({id:it.id,wait:3});
  save(); cur=null; render(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderProgress(){
  const tot=S.totals, rows=TOPICS.map(t=>{const s=S.topics[t.id]; const m=mastery(t.id); return {t,s,m,z:zone(m)};});
  rows.sort((a,b)=>(a.m==null)-(b.m==null)||(a.m??1)-(b.m??1));
  const gaps=rows.filter(r=>r.z==="core").length;
  const misses=S.history.filter(h=>!h.ok).slice(-30).reverse();
  const rmax=Math.max(1,...REASONS.map((r,i)=>S.reasons[i]||0));
  app.innerHTML=`<div class="page">
   <h2 class="ph">Progress</h2>
   <div class="summary">
     <div class="tile"><b>${Math.round(overall()*100)}%</b><span>Knowledge perfusion (all ${TOPICS.length} areas)</span></div>
     <div class="tile"><b>${rows.filter(r=>r.m!=null).length}/${TOPICS.length}</b><span>Areas assessed</span></div>
     <div class="tile"><b>${gaps}</b><span>Core gaps (&lt;40%)</span></div>
     <div class="tile"><b>${tot.steps?Math.round(100*tot.correct/tot.steps)+"%":"—"}</b><span>${tot.steps} answers all time</span></div>
     <div class="tile"><b>×${S.settings.lambda.toFixed(2)}</b><span>Error penalty factor</span></div>
   </div>
   <div class="tablewrap"><table><thead><tr><th>Guideline area</th><th>Status</th><th>Mastery</th><th>Answers</th><th>Correct</th><th>Section</th><th></th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.t.name)}</td><td><span class="pill ${r.z}">${ZLBL[r.z]}</span></td><td class="num">${pct(r.m)}</td><td class="num">${r.s?r.s.n:0}</td><td class="num">${r.s&&r.s.n?Math.round(100*r.s.k/r.s.n)+"%":"—"}</td><td class="num">${esc(r.t.sec)}</td><td><button class="linkbtn" data-drill="${r.t.id}">Drill</button></td></tr>`).join("")}
   </tbody></table></div>
   <div class="two">
    <div class="panel"><h2>Why answers went wrong</h2><p class="sub">From your reflection after each miss</p>
      ${REASONS.some((r,i)=>S.reasons[i])?REASONS.map((r,i)=>`<div class="rbar"><span>${esc(r)}</span><span class="track"><i class="z-core" style="width:${100*(S.reasons[i]||0)/rmax}%"></i></span><span class="pv">${S.reasons[i]||0}</span></div>`).join(""):`<p class="empty">No misses recorded yet.</p>`}
    </div>
    <div class="panel"><h2>How the score works</h2><p class="sub">Per guideline area, recent answers count more (each new answer decays older evidence by 10%)</p>
      <div class="formula">mastery = C ÷ (C + λ·E + 1)</div>
      <p class="note">C sums credit for correct answers (1 if certain, 0.85 fairly sure, 0.5 guessing). E sums errors (0.7 if guessing, 1 fairly sure, ${S.settings.confPenalty?"1.5":"1"} if certain). λ is your penalty factor, currently ${S.settings.lambda.toFixed(2)}. The +1 keeps a single lucky answer from reading as mastery. Areas below 40% are core gaps and get priority in case selection.</p>
      <p class="note">Case selection also discounts areas you haven't practiced recently. After ${FADE_FREE} sittings without a case in an area, its working mastery drops about ${Math.round((1-FADE)*100)}% per sitting, so it comes back sooner. A sitting ends after 30 minutes without an answer. The bars above always show your actual answers.</p>
    </div>
   </div>
   <div><h2 class="ph" style="font-size:19px;margin-bottom:10px">Missed answers</h2>
    <div class="log">${misses.length?misses.map(h=>{const it=BYID[h.id]; if(!it) return ""; const st=it.steps[h.step]; return `<div class="logi"><div class="m">${esc(new Date(h.t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}))} · Tier ${it.tier} · ${esc(st.topics.map(t=>TOPIC[t].name).join(", "))}${h.reason!=null?" · "+esc(REASONS[h.reason]):""}</div>
      <div><b>${esc(it.title)}</b>: ${esc(st.q)}</div>${h.commit?`<div>You committed to: <i>${esc(h.commit)}</i></div>`:""}<div>You chose: ${esc(st.o[h.choice][0])}</div><div>Guideline answer: ${esc(st.o[st.a][0])}</div><div style="margin-top:6px"><button class="linkbtn" data-retry="${it.id}">Retry this case</button></div></div>`;}).join(""):`<p class="empty">No missed answers yet. Missed cases also return automatically through spaced review.</p>`}</div>
   </div>
  </div>`;
}
function renderGuide(){
  app.innerHTML=`<div class="page"><h2 class="ph">Guideline reference</h2>
   <p class="note">Every recommendation used in the cases, grouped by area, checked against the recommendation tables and Tables 3–8 of the 2026 AHA/ASA Guideline for the Early Management of Patients With Acute Ischemic Stroke (Prabhakaran et al., <i>Stroke</i>. 2026;57:e316–e436; <a href="https://doi.org/10.1161/STR.0000000000000513" target="_blank" rel="noopener">doi:10.1161/STR.0000000000000513</a>). Wording is condensed; class (COR) and level of evidence (LOE) are as published. Table 8 entries are graded by the guideline's own color scale rather than a COR. "Guidelines in Action" links open the companion case reports in <i>Stroke</i>.</p>
   <div class="legend" style="font-size:12.5px">${["1","2a","2b","3NB","3H","T8g","T8r","T8x","T"].map(c=>corBadge(c)).join(" ")}</div>
   <div class="ggrid">${TOPICS.map(t=>{const m=mastery(t.id); const g=(GIA[t.id]||[]).map(x=>`<a href="https://doi.org/${x[1]}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join(" · "); return `<section class="gtopic"><h3>${esc(t.name)}</h3><div class="s">${esc(t.sec)} · ${m==null?"not yet assessed":"mastery "+pct(m)}</div><div class="recs">${Object.keys(RECS).filter(k=>RECS[k][0]===t.id).map(recHtml).join("")}</div>${g?`<p class="note" style="margin:10px 0 0">Guidelines in Action: ${g}</p>`:""}</section>`;}).join("")}</div>
  </div>`;
}
let confirmReset=false;
function renderSettings(){
  const forced=allSeen(), sc=seenCount();
  app.innerHTML=`<div class="page"><h2 class="ph">Settings</h2>
   <div class="panel">
    <div class="setrow"><div><b>Daily goal</b><p>Cases to finish each day to keep your streak. A multi-step case counts once.</p></div><div><input type="range" id="goal" min="1" max="10" step="1" value="${S.settings.goal}" aria-label="Daily goal"> <span class="pv" id="gval">${S.settings.goal} case${S.settings.goal>1?"s":""}</span></div></div>
    <div class="setrow"><div><b>Commit first</b><p>Type your answer before the options appear, then compare it with the guideline answer. ${forced?"Now permanent, because you've seen every case; this keeps familiar cases from turning into recognition practice.":`Becomes permanent once you've seen every case (${sc} of ${ITEMS.length} so far), so familiar cases don't turn into recognition practice.`}</p></div><button class="switch" id="commit" role="switch" aria-checked="${commitMode()}" aria-label="Commit first" ${forced?"disabled":""}></button></div>
    <div class="setrow"><div><b>Error penalty factor (λ)</b><p>How heavily a wrong answer pulls an area's mastery down relative to a right one. Changing it rescores everything instantly.</p></div><div><input type="range" id="lambda" min="1" max="3" step="0.25" value="${S.settings.lambda}" aria-label="Penalty factor"> <span class="pv" id="lval">×${S.settings.lambda.toFixed(2)}</span></div></div>
    <div class="setrow"><div><b>Penalize confident errors more</b><p>A wrong answer marked "Certain" counts 1.5× an ordinary error, because confidently held misconceptions are the riskiest at the bedside.</p></div><button class="switch" id="confpen" role="switch" aria-checked="${S.settings.confPenalty}" aria-label="Penalize confident errors"></button></div>
    <div class="setrow"><div><b>Unlock all tiers</b><p>Skip the progression and draw multi-guideline cases right away.</p></div><button class="switch" id="unlockall" role="switch" aria-checked="${S.settings.unlockAll}" aria-label="Unlock all tiers"></button></div>
    <div class="setrow"><div><b>Reset progress</b><p>Clears mastery, review schedule, streak, missed-answer log and reflections.</p></div><div class="actions">${confirmReset?`<button class="btn danger" data-act="reset">Erase everything</button><button class="btn ghost" data-act="cancelreset">Cancel</button>`:`<button class="btn ghost" data-act="askreset">Reset…</button>`}</div></div>
   </div>
   <p class="note">Progress saves automatically${remote?" to your account, so it follows you across devices":" in this browser"}. This is a study tool for learning the guideline, not clinical decision support; check the full guideline and local protocols in practice.</p>
  </div>`;
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  if(tab==="train") renderTrain(); else if(tab==="progress") renderProgress(); else if(tab==="guide") renderGuide(); else renderSettings();
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]"); if(!b) return; tab=b.dataset.tab; confirmReset=false; render();});
app.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.opt!=null && cur && !cur.submitted){cur.choice=+b.dataset.opt; render(); return;}
  if(b.dataset.conf && cur && !cur.submitted){cur.conf=b.dataset.conf; render(); return;}
  if(b.dataset.reason!=null && cur){cur.reflect=+b.dataset.reason; render(); return;}
  if(b.dataset.go){tab=b.dataset.go; render(); return;}
  if(b.dataset.drill){const t=b.dataset.drill; session.remediation[t]=3; session.remTier=4; const cands=ITEMS.filter(i=>i.topics.includes(t)&&i.tier<=unlockedTier()); const pick=cands.sort((a,b)=>((S.items[a.id]?.seen?1:0)-(S.items[b.id]?.seen?1:0))||a.tier-b.tier)[0]; if(pick) session.forced=pick.id; cur=null; tab="train"; render(); return;}
  if(b.dataset.retry){session.forced=b.dataset.retry; cur=null; tab="train"; render(); return;}
  const a=b.dataset.act;
  if(a==="reveal") reveal(); else if(a==="submit") submit(); else if(a==="next") next();
  else if(a==="practice"){session.practice=true; cur=null; render();}
  else if(a==="askreset"){confirmReset=true; render();} else if(a==="cancelreset"){confirmReset=false; render();}
  else if(a==="reset"){const st=S.settings; S=freshState(); S.settings=st; Object.assign(session,{answered:0,correct:0,streak:0,relearn:[],remediation:{},lastId:null,recent:[],forced:null,practice:false}); cur=null; confirmReset=false; save(); render();}
  if(b.id==="confpen"){S.settings.confPenalty=!S.settings.confPenalty; save(); render();}
  if(b.id==="unlockall"){S.settings.unlockAll=!S.settings.unlockAll; save(); render();}
  if(b.id==="commit"&&!allSeen()){S.settings.commitFirst=!S.settings.commitFirst; if(cur) cur.revealed=true; save(); render();}
});
app.addEventListener("input",e=>{
  if(e.target.id==="lambda"){S.settings.lambda=+e.target.value; const l=document.getElementById("lval"); if(l) l.textContent="×"+S.settings.lambda.toFixed(2); save();}
  if(e.target.id==="goal"){const g=+e.target.value; S.settings.goal=g; const d=S.days[todayKey()]; if(d) d.goal=g; const l=document.getElementById("gval"); if(l) l.textContent=g+" case"+(g>1?"s":""); save();}
  if(e.target.id==="commitTxt"&&cur){cur.commit=e.target.value; const b=app.querySelector('[data-act="reveal"]'); if(b) b.disabled=cur.commit.trim().length<2;}
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="commitTxt"){ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault(); reveal();} return; }
  if(tab!=="train"||!cur||e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.metaKey||e.ctrlKey||e.altKey) return;
  if(commitMode()&&!cur.revealed&&!cur.submitted) return;
  const st=cur.item.steps[cur.step];
  if(!cur.submitted && /^[1-9]$/.test(e.key)){const k=+e.key-1; if(k<st.o.length){cur.choice=cur.orders[cur.step][k]; render();}}
  else if(e.key==="Enter"){ if(!cur.submitted) submit(); else if(cur.results[cur.step]||cur.reflect!=null) next(); }
});
render();

/* ===================== ACCOUNT SYNC ===================== */
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const ref=db.doc("data/users/"+uid+"/progress");
    const snap=await ref.get();
    remote={ref};
    if(snap.exists){ const d=snap.data(); try{ const rs=JSON.parse(d.state); if((rs.updatedAt||0)>(S.updatedAt||0)){ S=normalize(rs); try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){} render(); } }catch(e){} setSync("Synced to your account"); }
    else if(S.updatedAt){ save(); } else setSync("Synced to your account");
  }catch(e){ remote=null; }
})();
</script>
